name: test

# GitHub-hosted fast-suite runner. Gitea uses the same scripts/verify.sh entry
# point, then adds the Docker-specific build and composed smoke on local-build.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Verify fast suite
        run: scripts/verify.sh
